<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Checkout | 1st Lady Cosmetic </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet">

    <link rel="stylesheet"
        href="css/style.css">

</head>

<body>


<!-- NAVBAR -->

<nav class="navbar navbar-expand-lg bg-white shadow-sm sticky-top">

    <div class="container">

        <a
            class="navbar-brand fw-bold"
            href="index.html">

            1st Last Cosmetic

        </a>


        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#mainNavbar">

            <span class="navbar-toggler-icon"></span>

        </button>


        <div
            class="collapse navbar-collapse"
            id="mainNavbar">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a
                        class="nav-link"
                        href="index.html">
                        Home
                    </a>
                </li>

                <li class="nav-item">
                    <a
                        class="nav-link"
                        href="shop.html">
                        Shop
                    </a>
                </li>

                <li class="nav-item">
                    <a
                        class="nav-link"
                        href="about.html">
                        About
                    </a>
                </li>

                <li class="nav-item">
                    <a
                        class="nav-link"
                        href="contact.html">
                        Contact
                    </a>
                </li>

                <li class="nav-item">

                    <a
                        class="nav-link"
                        href="cart.html">

                        <i class="bi bi-bag"></i>

                        Cart

                        <span
                            id="cartCount"
                            class="badge bg-dark">
                            0
                        </span>

                    </a>

                </li>

            </ul>

        </div>

    </div>

</nav>


<!-- CHECKOUT -->

<section class="py-5">

    <div class="container">

        <div class="text-center mb-5">

            <h1 class="fw-bold">
                Checkout
            </h1>

            <p class="text-muted">
                Complete your details to place your order.
            </p>

        </div>


        <div class="row g-4">


            <!-- CUSTOMER FORM -->

            <div class="col-lg-7">

                <div class="card border-0 shadow-sm p-4">

                    <h4 class="mb-4">
                        Customer Information
                    </h4>


                    <form id="checkoutForm">


                        <div class="mb-3">

                            <label class="form-label">
                                Full Name
                            </label>

                            <input
                                type="text"
                                id="fullName"
                                class="form-control"
                                required>

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Phone Number
                            </label>

                            <input
                                type="tel"
                                id="phone"
                                class="form-control"
                                required>

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Email Address
                            </label>

                            <input
                                type="email"
                                id="email"
                                class="form-control"
                                required>

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Delivery Address
                            </label>

                            <textarea
                                id="address"
                                class="form-control"
                                rows="3"
                                required></textarea>

                        </div>


                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    City
                                </label>

                                <input
                                    type="text"
                                    id="city"
                                    class="form-control"
                                    required>

                            </div>


                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    State
                                </label>

                                <input
                                    type="text"
                                    id="state"
                                    class="form-control"
                                    required>

                            </div>

                        </div>


                        <div class="mb-4">

                            <label class="form-label">
                                Delivery Instructions
                            </label>

                            <textarea
                                id="instructions"
                                class="form-control"
                                rows="3"
                                placeholder="Optional"></textarea>

                        </div>


                        <button
                            type="submit"
                            id="placeOrderBtn"
                            class="btn btn-dark w-100 py-3">

                            <i class="bi bi-check-circle me-2"></i>

                            Place Order

                        </button>

                    </form>

                </div>

            </div>


            <!-- ORDER SUMMARY -->

            <div class="col-lg-5">

                <div class="card border-0 shadow-sm p-4">

                    <h4 class="mb-4">
                        Order Summary
                    </h4>

                    <div id="checkoutItems"></div>

                    <hr>

                    <div class="d-flex justify-content-between mb-2">

                        <span>
                            Subtotal
                        </span>

                        <strong id="subtotal">
                            ₦0
                        </strong>

                    </div>


                    <div class="d-flex justify-content-between mb-2">

                        <span>
                            Delivery
                        </span>

                        <strong id="deliveryFee">
                            ₦0
                        </strong>

                    </div>


                    <hr>


                    <div class="d-flex justify-content-between">

                        <strong>
                            Total
                        </strong>

                        <strong
                            id="total"
                            class="fs-5">

                            ₦0

                        </strong>

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>


<script src="js/products.js"></script>

<script src="js/cart.js"></script>


<script>

const API_URL = "http://localhost:5000/api";


// ===============================
// FORMAT MONEY
// ===============================

function formatMoney(amount) {

    return "₦" + Number(amount).toLocaleString();
}


// ===============================
// DISPLAY CHECKOUT ITEMS
// ===============================

function displayCheckout() {

    const container =
        document.getElementById("checkoutItems");

    if (!cart || cart.length === 0) {

        container.innerHTML = `
            <div class="text-center py-4">

                <i class="bi bi-cart-x fs-1"></i>

                <p class="mt-2">
                    Your cart is empty.
                </p>

                <a
                    href="shop.html"
                    class="btn btn-dark">

                    Continue Shopping

                </a>

            </div>
        `;

        document.getElementById("placeOrderBtn")
            .disabled = true;

        return;
    }


    let html = "";

    let subtotal = 0;


    cart.forEach(item => {

        const itemTotal =
            Number(item.price) *
            Number(item.quantity);

        subtotal += itemTotal;


        html += `

            <div class="d-flex
                        align-items-center
                        mb-3">

                <img
                    src="${item.image}"
                    alt="${item.name}"
                    width="60"
                    height="60"
                    class="rounded"
                    style="object-fit: cover;">

                <div class="ms-3 flex-grow-1">

                    <h6 class="mb-1">
                        ${item.name}
                    </h6>

                    <small class="text-muted">
                        ${item.quantity} ×
                        ${formatMoney(item.price)}
                    </small>

                </div>

                <strong>
                    ${formatMoney(itemTotal)}
                </strong>

            </div>
        `;
    });


    const delivery =
        subtotal >= 50000
            ? 0
            : 3000;


    const total =
        subtotal + delivery;


    container.innerHTML = html;


    document.getElementById("subtotal")
        .textContent =
        formatMoney(subtotal);


    document.getElementById("deliveryFee")
        .textContent =
        delivery === 0
            ? "FREE"
            : formatMoney(delivery);


    document.getElementById("total")
        .textContent =
        formatMoney(total);
}


// ===============================
// SUBMIT ORDER
// ===============================

document
    .getElementById("checkoutForm")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            if (!cart || cart.length === 0) {

                alert("Your cart is empty.");

                return;
            }


            const button =
                document.getElementById(
                    "placeOrderBtn"
                );


            // Disable button
            button.disabled = true;

            button.innerHTML = `
                <span
                    class="spinner-border spinner-border-sm me-2">
                </span>

                Processing Order...
            `;


            const customer = {

                fullName:
                    document
                        .getElementById("fullName")
                        .value
                        .trim(),

                phone:
                    document
                        .getElementById("phone")
                        .value
                        .trim(),

                email:
                    document
                        .getElementById("email")
                        .value
                        .trim(),

                address:
                    document
                        .getElementById("address")
                        .value
                        .trim(),

                city:
                    document
                        .getElementById("city")
                        .value
                        .trim(),

                state:
                    document
                        .getElementById("state")
                        .value
                        .trim(),

                instructions:
                    document
                        .getElementById("instructions")
                        .value
                        .trim()
            };


            // Convert frontend cart
            // into backend order items

            const items = cart.map(item => ({

                productId: item.productId || item.id,

                name: item.name,

                price: Number(item.price),

                quantity: Number(item.quantity),

                image: item.image

            }));


            try {

                const response =
                    await fetch(
                        `${API_URL}/orders`,
                        {

                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({

                                customer,

                                items

                            })

                        }
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.message ||
                        "Unable to create order."
                    );
                }


                // Save order locally
                // for confirmation/history

                localStorage.setItem(
                    "lastOrder",
                    JSON.stringify(data.order)
                );


                // Empty cart

                localStorage.removeItem(
                    "cosmeticsCart"
                );


                // Update global cart
                if (typeof cart !== "undefined") {

                    cart.length = 0;

                }


                alert(
                    "🎉 Order placed successfully!"
                );


                // Redirect to order confirmation

                window.location.href =
                    "orders.html";


            } catch (error) {

                console.error(error);

                alert(
                    error.message ||
                    "Something went wrong while placing your order."
                );


                // Enable button again

                button.disabled = false;

                button.innerHTML = `
                    <i class="bi bi-check-circle me-2"></i>
                    Place Order
                `;
            }

        }
    );


// Load checkout

displayCheckout();

</script>

</body>

</html>
