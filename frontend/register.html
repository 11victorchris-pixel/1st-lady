<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1st Lady Cosmetic</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="card border-0 shadow-sm p-4 rounded-4">
          <div class="text-center mb-4">
            <h2 class="fw-bold"><span style="color:#b76e79;">Glow</span> Beauty</h2>
            <p class="text-muted">Create your new account</p>
          </div>

          <form id="registerForm" onsubmit="registerUser(event)">
            <div class="mb-3">
              <label class="form-label">Full Name</label>
              <input type="text" id="name" class="form-control" placeholder="Enter your full name" required>
            </div>

            <div class="mb-3">
              <label class="form-label">Email Address</label>
              <input type="email" id="email" class="form-control" placeholder="example@email.com" required>
            </div>

            <div class="mb-3">
              <label class="form-label">Phone Number</label>
              <input type="tel" id="phone" class="form-control" placeholder="23408186729201" required>
            </div>

            <div class="mb-3">
              <label class="form-label">Password</label>
              <input type="password" id="password" class="form-control" placeholder="Create a password" required>
            </div>

            <div class="mb-4">
              <label class="form-label">Confirm Password</label>
              <input type="password" id="confirmPassword" class="form-control" placeholder="Confirm password" required>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2">Create Account</button>
          </form>

          <p class="text-center mt-4 mb-0 text-muted">
            Already have an account? <a href="login.html" style="color:#b76e79;">Login</a>
          </p>
        </div>
      </div>
    </div>
  </div>

  <script src="js/auth.js"></script>
</body>
</html>
